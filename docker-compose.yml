services:
  postgres:
    image: postgres:16
    container_name: saedu_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: saedu_redis
    ports:
      - "${REDIS_PORT}:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: saedu_api
    environment:
      NODE_ENV: development
      PORT: ${API_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      SENTRY_DSN: ""
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      - postgres
      - redis
    ports:
      - "${API_PORT}:${API_PORT}"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: saedu_web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT}
      NEXT_PUBLIC_SENTRY_DSN: ""
      COURSE_OUTLINE_PATH: /app/packages/shared/content/course_outline.json
      LESSON_CONTENT_PATH: /app/packages/shared/content/lessons
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:${WEB_PORT}"

volumes:
  pg_data:
