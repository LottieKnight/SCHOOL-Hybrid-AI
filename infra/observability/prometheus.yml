global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: saedu-local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: saedu-api
    metrics_path: /metrics
    scheme: http
    # Set METRICS_TOKEN in the API and uncomment to authenticate scrapes.
    # authorization:
    #   type: Bearer
    #   credentials: replace-me
    static_configs:
      - targets:
          - host.docker.internal:4000
        labels:
          service: saedu-api
          env: local
