<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRAZIL — A Student Survival Story</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: radial-gradient(ellipse at center, #0d0520 0%, #020008 100%);
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
}

#game {
  width: 820px;
  height: 590px;
  position: relative;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(255,220,0,0.12),
              0 0 60px rgba(0,156,59,0.2),
              0 30px 120px rgba(0,0,0,0.9);
}

/* ══════════════ TITLE SCREEN ══════════════ */
#title-screen {
  position: absolute; inset: 0;
  background: linear-gradient(155deg, #004d20 0%, #002a12 25%, #001840 55%, #000b20 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 50; overflow: hidden;
}
.flag-bar { position:absolute; top:0; left:0; right:0; height:10px;
  background: linear-gradient(90deg,#009C3B 33.3%,#FFDF00 33.3%,#FFDF00 66.6%,#002776 66.6%); }
.flag-bar-bottom { position:absolute; bottom:0; left:0; right:0; height:10px;
  background: linear-gradient(90deg,#002776 33.3%,#FFDF00 33.3%,#FFDF00 66.6%,#009C3B 66.6%); }

/* Title stars */
#stars { position:absolute; inset:0; pointer-events:none; }
.star { position:absolute; width:2px; height:2px; background:white; border-radius:50%;
  animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s); opacity:var(--op,.4); }
@keyframes twinkle { 0%,100%{opacity:var(--op,.4);transform:scale(1)} 50%{opacity:.9;transform:scale(1.5)} }

.title-main { font-size:108px; font-weight:900; color:#FFDF00; letter-spacing:-6px; line-height:1;
  text-shadow:5px 5px 0 rgba(0,39,118,.7),0 0 60px rgba(255,220,0,.3);
  animation:titlePulse 4s ease-in-out infinite; position:relative; z-index:1; }
@keyframes titlePulse { 0%,100%{transform:scale(1);filter:brightness(1)} 50%{transform:scale(1.015);filter:brightness(1.1)} }

.title-sub { font-size:12px; font-weight:800; letter-spacing:7px; color:rgba(255,255,255,.6);
  text-transform:uppercase; margin-top:2px; position:relative; z-index:1; }
.title-quote { font-size:15px; font-style:italic; color:rgba(255,255,255,.4);
  margin-top:22px; position:relative; z-index:1; }
.title-start { margin-top:36px; background:#FFDF00; color:#002776; border:none;
  border-radius:50px; padding:15px 52px; font-family:'Nunito',sans-serif; font-size:15px;
  font-weight:900; letter-spacing:4px; text-transform:uppercase; cursor:pointer;
  box-shadow:0 0 40px rgba(255,220,0,.5),0 4px 20px rgba(0,0,0,.4); transition:all .2s; position:relative; z-index:1; }
.title-start:hover { transform:scale(1.07) translateY(-2px); box-shadow:0 0 60px rgba(255,220,0,.7),0 8px 30px rgba(0,0,0,.4); }
.title-credit { position:absolute; bottom:20px; font-size:10px; font-weight:700;
  color:rgba(255,255,255,.18); letter-spacing:3px; text-transform:uppercase; z-index:1; }

/* ══════════════ SCENE BG ══════════════ */
#scene-bg { position:absolute; inset:0; transition:background 1.2s ease; z-index:0; }

/* ══════════════ STATS BAR ══════════════ */
#stats { position:absolute; top:0; left:0; right:0; height:50px;
  background:rgba(4,4,12,.85); backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.07);
  display:flex; align-items:center; padding:0 20px; gap:20px; z-index:20; }
.stat-group { display:flex; flex-direction:column; gap:3px; }
.stat-lbl { font-size:9px; font-weight:800; letter-spacing:2px; text-transform:uppercase; opacity:.5; color:white; }
.bar-track { width:80px; height:6px; background:rgba(255,255,255,.12); border-radius:4px; overflow:hidden; }
.bar-fill { height:100%; border-radius:4px; transition:width .7s cubic-bezier(.4,0,.2,1); }
#hunger-fill { background:linear-gradient(90deg,#ffb347,#ff6b6b); }
#rep-fill    { background:linear-gradient(90deg,#4ecdc4,#45b7d1); }
#money-val { font-size:20px; font-weight:900; color:#FFDF00; text-shadow:0 0 12px rgba(255,220,0,.5); letter-spacing:-1px; }
#week-val  { margin-left:auto; font-size:10px; font-weight:800; letter-spacing:3px; color:rgba(255,255,255,.3); text-transform:uppercase; }

/* ══════════════ ACT LABEL ══════════════ */
#act-lbl { position:absolute; top:58px; left:18px; font-size:9px; font-weight:800;
  letter-spacing:3px; color:rgba(255,255,255,.2); text-transform:uppercase; z-index:5; pointer-events:none; }

/* ══════════════ SCENE ILLUSTRATION (SVG/CSS art) ══════════════ */
#illustration {
  position:absolute; top:50px; left:0; right:0; bottom:182px;
  z-index:3; pointer-events:none; overflow:hidden;
}
#illustration svg, #illustration canvas { width:100%; height:100%; }

/* Background scene layers */
.scene-layer { position:absolute; inset:0; }

/* ══════════════ CHARACTER PORTRAIT ══════════════ */
#character {
  position:absolute; bottom:188px; right:60px;
  z-index:6; width:180px; height:240px;
  transition:opacity .5s, transform .5s;
  pointer-events:none;
}
#character.left { right:auto; left:60px; }
#character svg { width:100%; height:100%; filter:drop-shadow(0 8px 30px rgba(0,0,0,.7)); }

/* Character float animation */
@keyframes charFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
#character { animation: charFloat 3.5s ease-in-out infinite; }

/* ══════════════ DIALOGUE BOX ══════════════ */
#dialogue-box {
  position:absolute; bottom:0; left:0; right:0; height:182px;
  background:rgba(5,5,18,.96); backdrop-filter:blur(16px);
  border-top:1.5px solid rgba(255,255,255,.08);
  padding:16px 22px 14px; z-index:20; cursor:pointer;
  display:flex; flex-direction:column; gap:0;
}
.dlg-top { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
#speaker-name { font-size:10px; font-weight:900; letter-spacing:4px; text-transform:uppercase; transition:color .3s; }
#mood-emoji { font-size:18px; line-height:1; transition:all .3s; }
#dialogue-text { font-size:15.5px; line-height:1.7; color:#d8e4ec; min-height:56px; flex:1; }
#advance-hint { font-size:9px; font-weight:700; color:rgba(255,255,255,.2); letter-spacing:1px;
  text-transform:uppercase; align-self:flex-end; animation:hintBlink 1.8s ease infinite; margin-top:4px; }
@keyframes hintBlink { 0%,100%{opacity:.2} 50%{opacity:.65} }

/* ══════════════ CHOICES ══════════════ */
#choices-box {
  position:absolute; bottom:0; left:0; right:0;
  background:rgba(5,5,18,.97); backdrop-filter:blur(16px);
  border-top:1.5px solid rgba(255,220,0,.1);
  padding:12px 18px 16px; z-index:20; display:none;
}
#choices-header { font-size:9px; font-weight:900; letter-spacing:4px; color:rgba(255,220,80,.4); text-transform:uppercase; margin-bottom:9px; }
.choice-btn { display:flex; align-items:center; gap:12px; width:100%;
  background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.09);
  border-radius:11px; padding:10px 14px; color:#c8d8e4; font-family:'Nunito',sans-serif;
  font-size:13.5px; font-weight:700; cursor:pointer; margin-bottom:6px;
  transition:all .18s; text-align:left; }
.choice-btn:last-child { margin-bottom:0; }
.choice-btn:hover { background:rgba(255,220,80,.09); border-color:rgba(255,220,80,.35); color:#FFDF00; transform:translateX(6px); }
.choice-num { width:22px; height:22px; border-radius:50%; background:rgba(255,220,80,.12);
  color:rgba(255,220,80,.75); font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

/* ══════════════ ENDING SCREEN ══════════════ */
#end-screen { position:absolute; inset:0; z-index:40; display:none; flex-direction:column;
  align-items:center; justify-content:center; padding:44px 52px; text-align:center; background:rgba(0,0,0,.6); }
.end-eyebrow { font-size:9px; font-weight:800; letter-spacing:5px; color:rgba(255,255,255,.3); text-transform:uppercase; margin-bottom:10px; }
.end-title { font-size:54px; font-weight:900; color:#FFDF00; letter-spacing:-2px; line-height:1; margin-bottom:18px; text-shadow:4px 4px 0 rgba(0,0,0,.5); }
.end-body { font-size:14.5px; line-height:1.78; color:rgba(255,255,255,.72); max-width:500px; margin-bottom:26px; }
.end-statrow { display:flex; gap:28px; margin-bottom:28px; }
.end-stat { text-align:center; }
.end-stat strong { display:block; font-size:26px; font-weight:900; color:#FFDF00; line-height:1; margin-bottom:4px; }
.end-stat span { font-size:10px; font-weight:700; letter-spacing:2px; color:rgba(255,255,255,.35); text-transform:uppercase; }
.restart-btn { background:transparent; border:1.5px solid rgba(255,255,255,.25); color:rgba(255,255,255,.6);
  border-radius:50px; padding:12px 36px; font-family:'Nunito',sans-serif; font-size:12px; font-weight:800;
  letter-spacing:3px; text-transform:uppercase; cursor:pointer; transition:all .2s; }
.restart-btn:hover { border-color:#FFDF00; color:#FFDF00; background:rgba(255,220,0,.06); }

/* ══════════════ NOTIFICATIONS ══════════════ */
#notifs { position:absolute; top:58px; right:14px; z-index:30; display:flex; flex-direction:column; gap:5px; pointer-events:none; }
.notif { background:rgba(0,0,0,.9); border-radius:20px; padding:5px 13px; font-size:12px; font-weight:800;
  animation:notifSlide 2.8s ease forwards; border:1px solid rgba(255,255,255,.08); }
@keyframes notifSlide { 0%{opacity:0;transform:translateX(12px)} 12%{opacity:1;transform:translateX(0)} 72%{opacity:1} 100%{opacity:0} }
.notif.pos { color:#6bcb77; border-color:rgba(107,203,119,.2); }
.notif.neg { color:#ff8a80; border-color:rgba(255,138,128,.2); }

/* ══════════════ SCENE ART CSS ══════════════ */

/* Dorm room night */
.bg-dorm { background:linear-gradient(180deg,#0a0a25 0%,#06061a 60%,#04040f 100%); }
.bg-dorm-warm { background:linear-gradient(180deg,#14100a 0%,#0a0806 100%); }
.bg-kitchen { background:linear-gradient(180deg,#1a1200 0%,#0f0c00 100%); }
.bg-campus { background:linear-gradient(180deg,#061a10 0%,#030d08 100%); }
.bg-outside { background:linear-gradient(180deg,#100520 0%,#06020e 100%); }
.bg-red { background:linear-gradient(180deg,#1a0505 0%,#0d0202 100%); }
.bg-dark { background:linear-gradient(180deg,#0d0d0d 0%,#060606 100%); }
.bg-office { background:linear-gradient(180deg,#080d1a 0%,#040810 100%); }
.bg-community { background:linear-gradient(180deg,#0a0020 0%,#050010 100%); }

</style>
</head>
<body>
<div id="game">

  <!-- TITLE SCREEN -->

    <div class="flag-bar"></div>

    <div id="stars"></div>

    <div class="title-quote">"Man cannot survive on bread alone."</div>

    <div class="title-credit">NMU Campus &nbsp;·&nbsp; Sem 1 &nbsp;·&nbsp; Week 8</div>
  </div>

  <!-- GAME CANVAS -->

    <div class="stat-group">
      <div class="stat-lbl">🔥 Hunger</div>
      <div class="bar-track"><div class="bar-fill" id="hunger-fill"></div></div>

    <div class="stat-group">
      <div class="stat-lbl">👥 Rep</div>

    <div id="week-val">Week 8</div>

  <div id="dialogue-box" onclick="advance()">

    <div id="dialogue-text"></div>

  <div id="choices-box">

  <div id="end-screen">

    <button class="restart-btn" onclick="restartGame()">↩ &nbsp;Play Again</button>
  </div>

  <div id="notifs"></div>
</div>

// ═══════════════════════════════════════════════════
//  ENGINE
// ═══════════════════════════════════════════════════
function startGame() {
  document.getElementById('title-screen').style.display='none';
  updateStats();
  playScene('intro');
}

let completionReported=false;
const runId=Math.random().toString(36).slice(2)+Date.now().toString(36);
function reportCompletion(){
  if(completionReported) return;
  completionReported=true;
  try{
    fetch('/api/games/scores',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({gameType:'brazil',score:0,runId:runId,metadata:{}})}).catch(function(){});
  }catch(e){}
}

function playScene(id) {
  scene=SCENES[id]; if(!scene) return;
  lineIdx=0; typing=false; clearTimeout(typeTimer);
  if(scene.isEnding){reportCompletion();showEnding(scene);return;}

  setBg(scene.bg);
  document.getElementById('act-lbl').textContent=scene.act||'';
  setArt(scene.art);
  setChar(scene.char);
  document.getElementById('dialogue-box').style.display='flex';
  document.getElementById('choices-box').style.display='none';
  document.getElementById('advance-hint').style.opacity='0';
  renderLine();
}

function setBg(col){
  document.getElementById('scene-bg').style.background=col;
}

function setArt(key){
  const el=document.getElementById('illustration');
  el.innerHTML = SCENES_ART[key]||'';
}

function setChar(key){
  const el=document.getElementById('character');
  if(!key||!CHAR_SVG[key]){el.style.opacity='0';el.innerHTML='';return;}
  el.innerHTML=CHAR_SVG[key];
  el.style.opacity='1';
  // Position: RA on left, others on right
  if(key==='ra'){el.classList.add('left');}
  else{el.classList.remove('left');}
}

function renderLine(){
  const lines=scene.lines;
  if(lineIdx>=lines.length){
    if(scene.choices)showChoices(scene.choices);
    else if(scene.auto)setTimeout(()=>playScene(scene.auto),400);
    return;
  }
  const ln=lines[lineIdx];
  const c=CHARS[ln.who]||CHARS.narrator;
  document.getElementById('speaker-name').textContent=c.name;
  document.getElementById('speaker-name').style.color=c.color;
  document.getElementById('mood-emoji').textContent=ln.mood||DEFAULT_MOODS[ln.who]||'';
  document.getElementById('advance-hint').style.opacity='0';

  // Show/update character portrait if it's a speaking character
  if(ln.who!=='narrator'&&ln.who!=='inner'&&CHAR_SVG[ln.who]){
    setChar(ln.who);
  }else if(ln.who==='narrator'||ln.who==='inner'){
    // Fade character slightly for narrator lines
    const charEl=document.getElementById('character');
    charEl.style.opacity='0.35';
  }

  typeText(document.getElementById('dialogue-text'),ln.text,()=>{
    document.getElementById('advance-hint').style.opacity='1';
  });
}

function typeText(el,text,cb){
  typing=true; let i=0; el.textContent=''; clearTimeout(typeTimer);
  function step(){
    if(i<text.length){el.textContent+=text[i++];typeTimer=setTimeout(step,19);}
    else{typing=false;if(cb)cb();}
  }
  step();
}

function advance(){
  if(typing){
    clearTimeout(typeTimer);typing=false;
    const ln=scene.lines[lineIdx];
    if(ln){
      document.getElementById('dialogue-text').textContent=ln.text;
      document.getElementById('mood-emoji').textContent=ln.mood||DEFAULT_MOODS[ln.who]||'';
    }
    document.getElementById('advance-hint').style.opacity='1';
    return;
  }
  lineIdx++;renderLine();
}

function showChoices(choices){
  document.getElementById('dialogue-box').style.display='none';
  const box=document.getElementById('choices-box');
  box.style.display='block';
  const list=document.getElementById('choices-list');
  list.innerHTML='';
  choices.forEach((ch,i)=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.innerHTML=`<span class="choice-num">${i+1}</span>${ch.text}`;
    btn.onclick=()=>pick(ch);
    list.appendChild(btn);
  });
}

function pick(ch){
  document.getElementById('choices-box').style.display='none';
  document.getElementById('dialogue-box').style.display='flex';
  const fx=ch.fx||{};const notifs=[];
  if(fx.hunger!=null){S.hunger=Math.max(0,Math.min(100,S.hunger+fx.hunger));notifs.push({txt:fx.hunger>0?`🔥 Hunger +${fx.hunger}`:`🔥 Hunger ${fx.hunger}`,pos:fx.hunger<0});}
  if(fx.money!=null){S.money=Math.max(0,S.money+fx.money);notifs.push({txt:fx.money>=0?`💰 +R${fx.money}`:`💰 -R${Math.abs(fx.money)}`,pos:fx.money>0});}
  if(fx.rep!=null){S.rep=Math.max(0,Math.min(100,S.rep+fx.rep));notifs.push({txt:fx.rep>0?`👥 Rep +${fx.rep}`:`👥 Rep ${fx.rep}`,pos:fx.rep>0});}
  if(fx.brazil!=null)S.brazil+=fx.brazil;
  if(ch.flag)S[ch.flag]=true;
  showNotifs(notifs);updateStats();
  playScene(ch.next);
}

function showNotifs(items){
  const el=document.getElementById('notifs');
  items.forEach((n,i)=>{
    setTimeout(()=>{
      const d=document.createElement('div');
      d.className=`notif ${n.pos?'pos':'neg'}`;
      d.textContent=n.txt;el.appendChild(d);
      setTimeout(()=>d.remove(),2800);
    },i*220);
  });
}

function updateStats(){
  document.getElementById('hunger-fill').style.width=S.hunger+'%';
  document.getElementById('rep-fill').style.width=S.rep+'%';
  document.getElementById('money-val').textContent='R'+S.money;
  document.getElementById('week-val').textContent='Week '+S.week;
}

function showEnding(sc){
  document.getElementById('dialogue-box').style.display='none';
  document.getElementById('choices-box').style.display='none';
  document.getElementById('character').style.opacity='0';
  document.getElementById('illustration').innerHTML='';
  document.getElementById('act-lbl').textContent='';
  setBg(sc.bg);
  document.getElementById('end-eyebrow').textContent=sc.eyebrow;
  document.getElementById('end-title').textContent=sc.title;
  document.getElementById('end-body').textContent=sc.body;
  const vals={rep:S.rep,money:S.money,brazil:S.brazil};
  document.getElementById('end-stats').innerHTML=sc.statLabels.map((lbl,i)=>
    `<div class="end-stat"><strong>${vals[sc.statKeys[i]]}</strong><span>${lbl}</span></div>`
  ).join('');
  document.getElementById('end-screen').style.display='flex';
}

function restartGame(){
  S={hunger:45,money:47,rep:60,brazil:0,week:8};
  document.getElementById('end-screen').style.display='none';
  document.getElementById('character').style.opacity='0';
  document.getElementById('illustration').innerHTML='';
  document.getElementById('title-screen').style.display='flex';
}

// Stars
(function(){
  const el=document.getElementById('stars');
  for(let i=0;i<65;i++){
    const s=document.createElement('div');s.className='star';
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
    s.style.setProperty('--d',(2+Math.random()*4)+'s');
    s.style.setProperty('--delay',-(Math.random()*4)+'s');
    s.style.setProperty('--op',(0.2+Math.random()*0.5).toString());
    el.appendChild(s);
  }
})();
</script>
